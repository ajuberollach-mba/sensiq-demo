<!DOCTYPE html>
<html lang="es">
<head>

<title>SENSIQ — Una alianza de VITIS y Cleardent (demo)</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
/* Colores oficiales SENSIQ (guía de marca) */
--brand-primary:#0A2F5C;--brand-secondary:#00A3A0;--background:#FFFFFF;--text-primary:#334155;--surface-soft:#F7FAFC;--status-alert:#E53E3E;--status-success:#28A745;
/* Extensión funcional propuesta para esta demo (NO es un color oficial) */
--status-warning:#B45309;
/* Variantes derivadas para contraste AA (texto y botones) */
--secondary-text:#007A78;--success-text:#1E7E34;--alert-text:#C53030;--secondary-tint:#E0F4F4;--success-tint:#E8F5EC;--alert-tint:#FFF5F5;--warning-tint:#FFF7ED;--primary-tint:#E8EEF5;--neutral-tint:#EDF2F7;--mid:#475569;--border:#D9E2EC;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0}
body{height:100%;background:var(--surface-soft);color:var(--text-primary);font:400 16px/1.5 'Inter',system-ui,-apple-system,'Segoe UI',sans-serif}
#app{max-width:430px;margin:0 auto;height:100%;display:flex;flex-direction:column;background:var(--surface-soft);position:relative;overflow:hidden}
@media(min-width:600px){#app{border-left:1px solid var(--border);border-right:1px solid var(--border)}}
:focus-visible{outline:3px solid var(--brand-primary);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
b,h1,h2,summary{font-weight:700}
h1{font-size:24px;color:var(--brand-primary);margin-bottom:12px;line-height:1.25}h2{font-size:20px;color:var(--brand-primary)}
small,.m{font-size:14px;color:var(--mid)}
.bn{display:flex;gap:8px;align-items:center;font-size:14px;background:var(--primary-tint);color:var(--brand-primary);padding:8px 12px;flex-shrink:0}
.bn button{margin-left:auto;background:none;border:0;color:var(--brand-primary);font:700 14px inherit;text-decoration:underline;cursor:pointer;min-height:44px}
.dmb{background:var(--brand-primary);color:#fff;border-radius:999px;padding:2px 10px;font-weight:700;font-size:14px}
main{flex:1;overflow-y:auto;padding:16px}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.brand{font-weight:700;color:var(--brand-primary);font-size:18px}.brand.big{font-size:28px}
.hd2{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.hd2 button,.bell{width:48px;height:48px;border-radius:12px;border:1px solid var(--border);background:#fff;color:var(--brand-primary);cursor:pointer;position:relative;display:flex;align-items:center;justify-content:center}
.bell b{position:absolute;top:-6px;right:-6px;background:var(--alert-text);color:#fff;font-size:14px;min-width:22px;height:22px;border-radius:11px;display:flex;align-items:center;justify-content:center}
.card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px}
.card p,.card .gl{margin-top:8px}
.val{font-size:32px;font-weight:700;color:var(--text-primary);line-height:1.2;margin-top:4px}.val small{margin-left:4px}
.btn,.btn2{display:block;width:100%;min-height:48px;border-radius:12px;font:700 16px inherit;cursor:pointer;margin:8px 0 0;padding:12px}
.btn{background:var(--brand-primary);color:#fff;border:0}.btn.co{background:var(--alert-text)}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn2{background:#fff;color:var(--brand-primary);border:2px solid var(--brand-primary)}
.lk{background:none;border:0;color:var(--brand-primary);text-decoration:underline;font:700 16px inherit;cursor:pointer;min-height:48px;display:block;margin:4px auto 0}
.bd,.tag{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--neutral-tint);color:var(--text-primary);margin:2px 4px 2px 0}
.bd.ok,.tag.ok{background:var(--success-tint);color:var(--success-text)}.bd.warn,.tag.w{background:var(--warning-tint);color:var(--status-warning)}.bd.alert{background:var(--alert-tint);color:var(--alert-text)}
.bd.cn{background:var(--secondary-tint);color:var(--secondary-text)}.bd.id,.bd.sv{background:var(--primary-tint);color:var(--brand-primary)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px 16px;margin-bottom:8px;color:var(--text-primary);font:inherit;cursor:pointer;min-height:56px}
.st{font-weight:700;font-size:18px;color:var(--brand-primary);margin:24px 0 8px}
.al{background:var(--alert-tint);border:1px solid #FEB2B2;color:var(--alert-text);border-radius:12px;padding:16px;margin-bottom:12px}
.disc{font-size:14px;color:var(--mid);background:#fff;border:1px solid var(--border);border-radius:8px;padding:8px 12px;margin:12px 0}
.hint{background:var(--secondary-tint);color:var(--secondary-text);border-radius:8px;padding:12px;margin-bottom:12px;font-weight:700}
.err{background:var(--alert-tint);color:var(--alert-text);border-radius:8px;padding:8px 12px;font-weight:700;margin:8px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{border:1px solid var(--border);background:#fff;color:var(--text-primary);border-radius:999px;padding:8px 16px;font:400 16px inherit;cursor:pointer;min-height:44px}
.chip.on{background:var(--brand-primary);color:#fff;border-color:var(--brand-primary);font-weight:700}
input,select{width:100%;min-height:48px;border:2px solid var(--border);border-radius:12px;padding:8px 12px;background:#fff;color:var(--text-primary);font:inherit;margin-top:4px}
label{display:block;font-weight:700;margin-bottom:12px}
.lg{padding-top:24px}.lg .brand{font-size:30px}.lg .card{margin-top:16px}
.pw{display:flex;gap:8px;align-items:center}.pw .lk{margin:0;white-space:nowrap}
.hint b{color:inherit}
nav{display:flex;background:#fff;border-top:1px solid var(--border);flex-shrink:0}
nav button{flex:1;background:none;border:0;padding:8px 2px;color:var(--mid);font:400 14px inherit;cursor:pointer;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav button.on{color:var(--brand-primary);font-weight:700;border-top:3px solid var(--brand-secondary)}
.mo{position:absolute;inset:0;background:rgba(51,65,85,.65);display:flex;align-items:flex-end;z-index:30}
.mo>div{background:#fff;width:100%;border-radius:16px 16px 0 0;padding:24px 16px;max-height:90%;overflow-y:auto}
.bar{height:8px;background:var(--neutral-tint);border-radius:8px;overflow:hidden;margin:12px 0}.bar i{display:block;height:100%;background:var(--brand-primary)}
#toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--text-primary);color:#fff;padding:12px 16px;border-radius:12px;z-index:50;max-width:90%;display:none}
.tg{display:flex;justify-content:space-between;align-items:center;gap:12px}.tg input{width:28px;height:28px;margin:0}
details summary{cursor:pointer;min-height:44px;display:flex;align-items:center;color:var(--brand-primary)}
.sp{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:#fff}
.code{font-size:36px;font-weight:700;letter-spacing:.3em;color:var(--brand-primary);text-align:center;margin:12px 0}
.sw{display:inline-block;width:16px;height:16px;border-radius:4px;border:1px solid var(--border);vertical-align:middle;margin-right:8px}
svg text{fill:var(--mid);font-size:11px}
nav button{text-align:center;line-height:1.2;padding:8px 1px;font-size:12px;min-width:0;overflow-wrap:anywhere}
.igrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.ind{background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font:inherit;color:var(--text-primary);cursor:pointer;min-height:136px}.ii{color:var(--brand-primary)}.in{font-size:14px;line-height:1.2}.iv{font-size:22px}.ind .bd{font-size:13px;padding:2px 8px;margin:0}
.leg{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:14px;margin-top:8px}.leg span{display:inline-flex;align-items:center;gap:6px}.av{width:48px;height:48px;border-radius:50%;background:var(--brand-primary);color:#fff;font-weight:700;font-size:20px;display:flex;align-items:center;justify-content:center}.tip{background:var(--secondary-tint);border-color:transparent}.tip b{color:var(--secondary-text)}.chartb{display:block;width:100%;background:none;border:0;cursor:pointer;margin-top:8px;color:inherit;text-align:left}
.av{overflow:hidden;flex-shrink:0}.logo{display:block;margin:0 auto}.sp img{max-width:70%;height:auto}
.lnk{display:flex;align-items:center;gap:8px;min-height:48px;color:var(--brand-primary);font-weight:700;text-decoration:underline}.peer{position:relative;height:12px;background:var(--neutral-tint);border-radius:8px;margin:20px 0 8px}.peer i{position:absolute;top:-5px;width:8px;height:22px;background:var(--brand-primary);border-radius:4px}.bg2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.bg2 .card{margin:0}.big2{font-size:34px;font-weight:700;color:var(--brand-primary);line-height:1.1}.sel{border:2px solid var(--brand-primary)}

/* ===== Refinamiento visual · sistema de diseño v2 (solo apariencia) ===== */
:root{--r-lg:20px;--line:#E6ECF3;--shadow-1:0 1px 2px rgba(10,47,92,.05),0 8px 24px rgba(10,47,92,.07);--shadow-2:0 10px 32px rgba(10,47,92,.16)}
html{-webkit-tap-highlight-color:transparent}
body{background:linear-gradient(180deg,#E8EEF5 0,#F7FAFC 280px) no-repeat,#F7FAFC;letter-spacing:-.005em;-webkit-font-smoothing:antialiased}
#app{background:transparent}
input[type=checkbox]{accent-color:var(--brand-primary)}
main{padding:20px 16px 24px}
h1{font-size:28px;letter-spacing:-.02em;line-height:1.15;margin-bottom:16px}
h2{font-size:21px;letter-spacing:-.015em}
small,.m{line-height:1.45}
.card{border:0;border-radius:var(--r-lg);padding:18px;margin-bottom:14px;box-shadow:var(--shadow-1)}
.card.hero{background:linear-gradient(160deg,#fff 0%,#E8EEF5 100%)}
.card .val,.val{font-size:36px;letter-spacing:-.02em;color:var(--brand-primary)}
.st{font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--mid);margin:28px 4px 10px}
.hd{margin-bottom:20px}
.av{box-shadow:0 0 0 3px #fff,0 6px 14px rgba(10,47,92,.2)}
.bell,.hd2 button{border:0;border-radius:50%;box-shadow:var(--shadow-1);transition:transform .12s ease}
.bell:active,.hd2 button:active{transform:scale(.94)}
.btn,.btn2{min-height:52px;border-radius:16px;margin-top:10px;transition:transform .12s ease,box-shadow .12s ease,background .12s ease}
.btn{box-shadow:0 8px 18px rgba(10,47,92,.28)}
.btn.co{box-shadow:0 8px 18px rgba(197,48,48,.28)}
.btn2{background:var(--primary-tint);border:0;color:var(--brand-primary);box-shadow:none}
.btn:active,.btn2:active{transform:scale(.985)}
.btn:disabled{box-shadow:none}
.lk{font-size:15px;text-underline-offset:3px}
.bd,.tag{padding:5px 12px;margin:2px 6px 2px 0}
.row{border:0;border-radius:var(--r-lg);padding:14px 16px;min-height:64px;margin-bottom:10px;box-shadow:var(--shadow-1);transition:transform .12s ease}
.row:active{transform:scale(.99)}
.row.sel{box-shadow:inset 0 0 0 2px var(--brand-primary),var(--shadow-1)}
.chips{gap:8px}
.chip{border:0;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line);padding:9px 16px;transition:background .15s ease}
.chip.on{background:var(--brand-primary);box-shadow:none}
.igrid{gap:10px}
.ind{border:0;border-radius:var(--r-lg);box-shadow:var(--shadow-1);padding:16px 6px 14px;gap:8px;min-height:152px;transition:transform .12s ease}
.ind:active{transform:scale(.97)}
.ii{width:48px;height:48px;border-radius:50%;background:var(--primary-tint);display:flex;align-items:center;justify-content:center}
.ind[data-s=ok] .ii{background:var(--success-tint);color:var(--success-text)}
.ind[data-s=warn] .ii{background:var(--warning-tint);color:var(--status-warning)}
.ind[data-s=alert] .ii{background:var(--alert-tint);color:var(--alert-text)}
.in{font-weight:700;font-size:14px;line-height:1.2}
.al{border:0;border-radius:var(--r-lg);background:linear-gradient(160deg,#FFF5F5,#FFE9E5);box-shadow:var(--shadow-1);position:relative;padding:18px 18px 18px 24px}
.al::before{content:'';position:absolute;left:0;top:16px;bottom:16px;width:5px;border-radius:0 4px 4px 0;background:var(--status-alert)}
.al>b:first-child{font-size:18px}
.tip{background:linear-gradient(160deg,#E6F6F4,#F0FAF8)}
.disc{background:transparent;border:0;text-align:center;font-size:13px;padding:4px 8px;margin:18px 0 4px}
.hint,.err{border-radius:14px}
input,select{min-height:52px;border:1.5px solid var(--line);border-radius:14px;padding:10px 14px;transition:border-color .15s ease,box-shadow .15s ease}
input:focus,select:focus{border-color:var(--brand-primary);box-shadow:0 0 0 4px rgba(10,47,92,.12);outline:none}
label{font-size:14px;color:var(--mid)}
.tg{color:var(--text-primary);font-size:16px;gap:16px}
.tg input[role=switch],input[role=switch]{-webkit-appearance:none;appearance:none;flex-shrink:0;width:52px;height:32px;min-height:0;margin:0;border:0;border-radius:16px;background:#CBD5E0;position:relative;cursor:pointer;transition:background .2s ease}
input[role=switch]::after{content:'';position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s ease}
input[role=switch]:checked{background:var(--secondary-text)}
input[role=switch]:checked::after{transform:translateX(20px)}
.bar{height:10px;border-radius:10px}.bar i{background:linear-gradient(90deg,#0A2F5C,#00A3A0);border-radius:10px}
details summary{list-style:none;display:flex;align-items:center;min-height:44px}
details summary::-webkit-details-marker{display:none}
details summary::after{content:'';width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;margin-left:auto;transform:rotate(45deg);transition:transform .2s ease}
details[open]>summary::after{transform:rotate(-135deg)}
details.more{margin-top:4px}details.more summary{min-height:40px;font-size:14px;font-weight:700;color:var(--brand-primary)}
details.more p{margin-top:2px;font-size:15px;color:var(--mid)}
nav{margin:0 12px 12px;padding:6px;border:0;border-radius:26px;background:rgba(255,255,255,.97);box-shadow:var(--shadow-2)}
nav button{border-radius:20px;min-height:56px;gap:3px;transition:background .15s ease,color .15s ease}
nav button.on{background:var(--primary-tint);border-top:0}
.mo{background:rgba(15,27,51,.5)}
.mo>div{border-radius:28px 28px 0 0;padding:12px 20px 28px;box-shadow:0 -10px 40px rgba(0,0,0,.2)}
.mo>div::before{content:'';display:block;width:44px;height:5px;border-radius:3px;background:#CBD5E0;margin:0 auto 18px}
#toast{border-radius:999px;padding:12px 20px;bottom:100px;box-shadow:var(--shadow-2)}
.lg{padding-top:36px}.lg .logo{width:210px;max-width:70%;height:auto;margin-bottom:6px}.lg .card{padding:22px;margin-top:24px;box-shadow:var(--shadow-2)}
.sp{background:linear-gradient(180deg,#fff,#E8EEF5)}
.peer{height:14px;border-radius:8px}.big2{letter-spacing:-.02em}
.code{background:var(--primary-tint);border-radius:16px;padding:12px 0}
.lnk{border-radius:12px}
.q{font-weight:700;font-size:16px;margin:20px 0 4px;color:var(--text-primary)}
.lk.inl{display:inline;min-height:0;margin:0;font:inherit;font-weight:700;text-align:left;text-underline-offset:3px}
.lh{position:sticky;top:-12px;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;padding:8px 0 12px;margin-bottom:4px;border-bottom:1px solid var(--line)}
.lh b{font-size:18px;color:var(--brand-primary)}.btn2.sm{width:auto;min-height:44px;margin:0;padding:8px 18px}
.legal{font-size:15px;line-height:1.6;color:var(--text-primary);padding-bottom:12px}
.legal h1{font-size:20px;line-height:1.25;margin:12px 0 8px}.legal h2{font-size:18px;margin:24px 0 8px}.legal h3{font-size:16px;margin:18px 0 6px;color:var(--text-primary)}
.legal p{margin:8px 0}.legal ul{margin:8px 0 8px 20px}.legal li{margin:6px 0}
.legal .call{margin:14px 0;padding:14px 16px;border-radius:14px;background:var(--primary-tint)}.legal .call p:first-child{font-weight:700;color:var(--brand-primary)}
.legal .tw{overflow-x:auto;margin:12px 0;border-radius:12px;box-shadow:inset 0 0 0 1px var(--line)}
.legal table{border-collapse:collapse;width:100%;min-width:520px;font-size:14px}.legal th,.legal td{text-align:left;vertical-align:top;padding:10px 12px;border-bottom:1px solid var(--line)}.legal th{background:var(--primary-tint);color:var(--brand-primary)}
.steps p{display:flex;align-items:center;gap:10px;margin:12px 0}
/* ===== v3: menú con acción central y bloques minimalistas ===== */
nav{overflow:visible}
nav button.ctr{color:var(--brand-primary);font-weight:700;justify-content:flex-end;padding-bottom:6px}
nav button.ctr .cb{width:56px;height:56px;border-radius:50%;background:var(--brand-primary);color:#fff;display:flex;align-items:center;justify-content:center;margin-top:-30px;margin-bottom:2px;border:4px solid #fff;box-shadow:0 8px 18px rgba(10,47,92,.35);transition:transform .12s ease}
nav button.ctr:active .cb{transform:scale(.94)}
nav button.ctr.on{background:transparent}
nav button.ctr.on .cb{background:var(--secondary-text)}
.btn svg{vertical-align:-4px;margin-right:4px}
.or{text-align:center;font-size:14px;color:var(--mid);margin:14px 0 6px}
.cpr{display:flex;gap:8px;align-items:stretch}.cpr input{flex:1;margin:0;min-width:0}.cpr .btn2{width:auto;margin:0;padding:0 20px}
.clh{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;background:none;border:0;padding:0;text-align:left;font:inherit;color:var(--text-primary);cursor:pointer;min-height:44px}
.clh b{color:var(--brand-primary)}
.nh{display:flex;justify-content:space-between;align-items:center;margin:4px 4px 10px}
.chips.seg{margin:12px 0 4px}
details.more select{margin-bottom:8px}
/* ===== v5: Mi cepillo con producto, evolución global ===== */
.bh{position:relative;display:grid;grid-template-columns:120px 1fr;gap:4px 8px;background:linear-gradient(160deg,#0A2F5C 0%,#123F73 55%,#00A3A0 140%);border-radius:24px;padding:18px 16px 18px 10px;color:#fff;overflow:hidden;box-shadow:0 10px 24px rgba(10,47,92,.25)}
.bh:before{content:"";position:absolute;left:-40px;top:30px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(0,163,160,.45),transparent 70%)}
.bhi{position:relative;height:420px;display:flex;justify-content:center}.bhi img{height:100%;width:auto;filter:drop-shadow(0 10px 14px rgba(0,0,0,.35));position:relative}
.pdot{position:absolute;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:#A0AEC0;border:2px solid #fff;z-index:2}
.pdot.on{background:#00A3A0;animation:pp 2s infinite}
.pdot.p1{top:4%}.pdot.p2{top:48%}.pdot.p3{top:85%}
@keyframes pp{0%{box-shadow:0 0 0 0 rgba(0,163,160,.7)}70%{box-shadow:0 0 0 10px rgba(0,163,160,0)}100%{box-shadow:0 0 0 0 rgba(0,163,160,0)}}
@media (prefers-reduced-motion:reduce){.pdot.on{animation:none}}
.bhc{position:relative;height:420px}
.bht{grid-column:1/-1;display:flex;flex-direction:column;margin:0 0 10px 6px;position:relative}.bht b{font-size:18px}.bht small{color:#CFE3F5}
.bco{position:absolute;left:0;right:0;padding-left:10px;border-left:2px solid rgba(255,255,255,.35)}
.bco:before{content:"";position:absolute;left:-56px;top:9px;width:54px;border-top:2px dashed rgba(255,255,255,.55)}
.bco b{display:flex;align-items:center;gap:6px;font-size:15px}.bco small{display:block;color:#DCEAF7;font-size:13px;line-height:1.35}
.bco.c1{top:3%}.bco.c2{top:44%}.bco.c3{top:83.5%}
.bco svg{flex-shrink:0}
.gx{display:flex;align-items:baseline;gap:6px;margin:6px 0 2px}.gx b{font-size:40px;color:var(--brand-primary);line-height:1}.gx span{color:var(--mid)}.gx small{margin-left:auto;font-weight:700}
.g{color:var(--success-text)}.r{color:var(--alert-text)}
.irl{padding:6px 12px 12px}
.ir{border-bottom:1px solid var(--line)}.ir:last-of-type{border-bottom:0}

<script>
//#LOGIC-START
const D=864e5,H=36e5,DEV='Cepillo SENSIQ';
const KP={plaque:{n:'Placa',s:'Restos pegajosos en los dientes',u:'/100',x:'La placa es una capa de bacterias que se acumula en los dientes al comer y beber. Si no se retira, puede irritar las encías y dañar los dientes. Cuanto más baja, mejor.'},gingi:{n:'Gingivitis',s:'Encías inflamadas',u:'/100',x:'Es la inflamación de las encías: pueden estar rojas, hinchadas o sangrar al cepillarte. Si se trata a tiempo, se revierte. Cuanto más baja, mejor.'},caries:{n:'Caries incipientes',s:'Dientes que empiezan a dañarse',u:'/100',x:'Son zonas del diente que empiezan a debilitarse. Si se detectan pronto, se pueden frenar sin empaste. Cuanto más baja, mejor.'},perio:{n:'Periodontitis',s:'Encías en riesgo',u:'/100',x:'Es una infección de las encías más seria que la gingivitis: puede dañar el hueso que sujeta los dientes. Esto es una señal de alerta, no un diagnóstico. Cuanto más baja, mejor.'},habit:{n:'Hábitos de cepillado',s:'Cómo te cepillas',u:'/100',x:'Valora cuánto tiempo y cómo te cepillas. Cuanto más alto, mejor.'},ph:{n:'Acidez de la saliva',s:'Cómo es tu saliva',u:'',x:'Indica si tu saliva es más o menos ácida. Todavía no tenemos una referencia para valorarla.'}};
const EXP=['plaque','gingi','caries','perio','habit'];
/* Umbrales centralizados. Los límites «ok» son los ya existentes; los límites «warn» son ilustrativos. No son umbrales clínicos. */
const TH={plaque:{hi:0,ok:40,warn:50},gingi:{hi:0,ok:40,warn:55},caries:{hi:0,ok:35,warn:50},perio:{hi:0,ok:30,warn:30},habit:{hi:1,ok:70,warn:55}};
const RANK={ok:1,warn:2,alert:3};
const hist=S=>[...S.hist].sort((a,b)=>b.t-a.t);
function st(k,v){if(v==null||isNaN(v))return'na';const t=TH[k];if(!t)return'nothr';return t.hi?(v>=t.ok?'ok':v>=t.warn?'warn':'alert'):(v<=t.ok?'ok':v<=t.warn?'warn':'alert')}
function glob(r){const ks=[...new Set([...EXP,...Object.keys(r.v)])],s=ks.map(k=>st(k,r.v[k])),ev=s.filter(x=>RANK[x]);let top='na';ev.forEach(x=>{if(top=='na'||RANK[x]>RANK[top])top=x});return{top,partial:s.some(x=>x=='na'||x=='nothr'),nAlert:s.filter(x=>x=='alert').length,nWarn:s.filter(x=>x=='warn').length,none:!ev.length}}
function gmsg(g){const p=(n,a)=>`Hay ${n} aspecto${n>1?'s':''} que conviene ${a}`;if(g.none)return'No se puede valorar ningún aspecto.';if(g.nAlert)return p(g.nAlert,'consultar con tu clínica')+'.'+(g.nWarn?' '+p(g.nWarn,'vigilar')+'.':'');if(g.nWarn)return p(g.nWarn,'vigilar')+'.';if(g.partial)return'Resultado incompleto: faltan datos para valorarlo todo.';return'Todo va bien. ¡Sigue así!'}
function trend(S,r,k){const v=r.v[k];if(v==null)return{c:'none'};const p=hist(S).find(x=>x.t<r.t&&x.v[k]!=null);if(!p)return{c:'none'};const b=p.v[k],d=v-b;if(!TH[k])return{c:d?'neutral':'same',d,b};if(!d)return{c:'same',d,b};return{c:(TH[k].hi?d>0:d<0)?'better':'worse',d,b}}
function mk(i,now){const w=i>60?3:0;let pl=30+(i*5)%7,gi=38+(i*7)%5+w,ca=26+(i*3)%5,pe=22+(i*11)%6,ha=76-(i*13)%6-w;if(i==1){pl=30;gi=44;ca=27;pe=29;ha=72}if(i==0){pl=32;gi=49;ca=28;pe=36;ha=74}return{id:'r'+i,t:now-i*D-2*H,v:{plaque:pl,gingi:gi,caries:ca,perio:pe,habit:ha},owner:'elena',dev:DEV,sess:{id:'sh'+i,owner:'elena',verified:true}}}
function init(now=Date.now(),sample=false){const h=[],seen={},used={};let pend=[];
if(sample){for(let i=0;i<90;i++)if(i!=4&&i!=5){const r=mk(i,now);r.imp=r.t;h.push(r);seen[r.id]=1;used[r.sess.id]=r.id}
pend=[5,4].map(i=>{const r=mk(i,now);r.id='p'+i;r.sess.id='sp'+i;return r})}
return fill({acct:'elena',logged:false,u:'Elena',tab:'home',nav:[],hist:h,pend,excl:[],seen,used,seq:0,conn:true,dev:sample?{name:DEV,linked:true,fp:true,lastId:now-4*D-2*H}:{name:DEV,linked:false,fp:false,lastId:null},scn:'alert',alert:sample?'active':'none',
notifs:sample?[{id:'n0',t:'Aviso preventivo',b:'Hemos detectado una señal de alerta en tus encías. Te recomendamos pedir una revisión con tu dentista.',at:now-2*H,read:false,to:'alert'}]:[],appts:[],np:{cita:true},sh:{clin:false,b2b:false}},now,true,sample)}
function loadSample(S,now){const d=init(now,true);['hist','pend','seen','used','excl','hc','head','notifs','dev','alert'].forEach(k=>{S[k]=d[k]});S.conn=true;S.appts=[];return S}
function syncAlert(S){const l=hist(S)[0],a=!!l&&glob(l).nAlert>0;if(a){if(S.alert=='none')S.alert='active'}else if(S.alert=='active')S.alert='none';return S.alert}
function alertText(l){return st('perio',l.v.perio)=='alert'?'Hemos detectado una señal de alerta en tus encías. Te recomendamos pedir una revisión con tu dentista.':'Conviene consultar con tu clínica: '+EXP.filter(k=>st(k,l.v[k])=='alert').map(k=>KP[k].n).join(', ')+'.'}
function startSession(S,m,now){if(m=='read')return{err:'read'};if(m!='ok')return{err:'unknown'};if(!S.dev.linked||!S.dev.fp)return{err:'unlinked'};S.dev.lastId=now;return{sess:{id:'s'+(++S.seq),owner:S.acct,verified:true}}}
function saveAnalysis(S,sess,v,now){if(!sess||sess.verified!==true)return{ok:0,why:'noid'};if(S.used[sess.id])return{ok:0,why:'used'};if(sess.owner!==S.acct)return{ok:0,why:'foreign'};const r={id:'m'+(++S.seq),t:now,v:{...v},owner:sess.owner,dev:S.dev.name,sess:{...sess}};S.used[sess.id]=r.id;if(S.conn){r.imp=now;S.hist.push(r);S.seen[r.id]=1;return{ok:1,where:'perfil',r}}S.pend.push(r);return{ok:1,where:'pend',r}}
function importAll(S,now){const o={imp:0,dup:0,foreign:0,noid:0,unl:0,reuse:0,last:null},keep=[];let lt=-1;
for(const p of S.pend){
if(!S.dev.linked||!S.dev.fp){o.unl++;keep.push(p);continue}
if(!p.sess||p.sess.verified!==true||!p.sess.id){o.noid++;keep.push(p);continue}
if(p.sess.owner!==S.acct||p.owner!==S.acct){o.foreign++;S.excl.push({id:p.id,why:'foreign'});continue}
if(S.seen[p.id]){o.dup++;continue}
if(S.used[p.sess.id]&&S.used[p.sess.id]!==p.id){o.reuse++;S.excl.push({id:p.id,why:'reuse'});continue}
S.used[p.sess.id]=p.id;S.seen[p.id]=1;p.imp=now;S.hist.push(p);o.imp++;if(p.t>lt){lt=p.t;o.last=p.id}}
S.pend=keep;return o}
function scen(S,n,now){const k=++S.seq,r={id:'x'+k,t:now,v:{plaque:33,gingi:46,caries:28,perio:27,habit:73},owner:S.acct,dev:S.dev.name,sess:{id:'sx'+k,owner:S.acct,verified:true}};
if(n=='offline')r.t=now-3*H;
if(n=='foreign'){r.owner='otra';r.sess.owner='otra';r.t=now-5*H}
if(n=='noid'){r.sess.verified=false;r.t=now-6*H}
if(n=='old'){r.t=now-100*D}
if(n=='partial'){r.t=now-H;r.v={plaque:null,gingi:32,caries:25,perio:20,habit:80}}
if(n=='nothr'){r.t=now-30*6e4;r.v={plaque:33,gingi:34,caries:27,perio:22,habit:78,ph:7.1}}
if(n=='dup'){const l=hist(S)[0];S.pend.push({...l,imp:undefined,v:{...l.v},sess:{...l.sess}});return}
S.pend.push(r)}
function seedHC(now){return[{id:'v1',t:now-430*D,cid:1,dr:'Dra. Marta Ibáñez',mot:'Revisión y limpieza',hizo:'Revisión completa y limpieza de sarro.',rec:'Hacer una limpieza profesional una vez al año.',prox:'En 12 meses'},{id:'v2',t:now-270*D,cid:3,dr:'Dr. Pablo Serrano',mot:'Empaste en una muela',hizo:'Se trató con un empaste una caries pequeña en una muela inferior.',rec:'Evitar alimentos muy duros durante las primeras 24 horas.',prox:'Revisión en 6 meses'},{id:'v3',t:now-95*D,cid:1,dr:'Dra. Marta Ibáñez',mot:'Revisión de encías',hizo:'Se vieron las encías algo inflamadas. Se explicó cómo usar el cepillo interdental.',rec:'Usar hilo o cepillo interdental a diario y repetir la revisión.',prox:'En 3 meses'}]}
function fill(S,now,fresh,sample){S.sh=S.sh||{clin:false,b2b:false};if(S.sh.health===undefined)S.sh.health=false;S.onb=S.onb||{done:!fresh,step:1};S.q=Object.assign({age:'34',sex:'Mujer',smoke:'No',diab:'No',bleed:'A veces',visit:'Entre 6 y 12 meses',brush:'2',floss:'A veces',cond:['Ninguna de estas'],meds:['Ninguno de estos'],medOther:'',alerg:'No',alergT:'',apar:['Ninguno'],sug:'A veces',embar:'No'},S.q||{});S.hc=S.hc||((sample||!fresh)?seedHC(now):[]);S.head=S.head||{since:(sample||!fresh)?now-74*D:now};return S}
function oralAge(S,r){const a=parseInt(S.q&&S.q.age);if(!a||!r)return null;const adj={ok:-1,warn:2,alert:4};let d=0;EXP.forEach(k=>{d+=adj[st(k,r.v[k])]||0});const b=Math.max(18,a+d);return{real:a,bucal:b,diff:b-a}}
function peer(S,o){const lo=Math.floor(o.real/10)*10,sx=S.q.sex,g=sx=='Mujer'?'Mujeres':sx=='Hombre'?'Hombres':'Personas';return{pct:Math.max(5,Math.min(95,Math.round(50-o.diff*8))),grp:`${g} de ${lo} a ${lo+9} años`}}
function badges(S,now=Date.now()){const l=hist(S)[0],n14=S.hist.filter(r=>r.t>=now-14*D).length;return[{id:'a',n:'Primer análisis',d:'Haz tu primer análisis',ok:S.hist.length>0,p:''},{id:'b',n:'Constancia',d:'10 análisis en 14 días',ok:n14>=10,p:n14+' de 10'},{id:'c',n:'Encías en forma',d:'Gingivitis en «Bien»',ok:!!l&&st('gingi',l.v.gingi)=='ok',p:l?'Ahora: '+l.v.gingi+' (objetivo: 40 o menos)':''},{id:'d',n:'Cepillado de 10',d:'Hábitos de cepillado de 80 o más',ok:!!l&&l.v.habit>=80,p:l?'Ahora: '+l.v.habit+' de 80':''}]}
function reto(S){const l=hist(S)[0];if(!l)return null;const g=l.v.gingi;return g>40?{t:'Baja tu gingivitis a 40 o menos',p:`Ahora estás en ${g}. Te faltan ${g-40} puntos.`,met:0}:{t:'Mantén tus encías en forma',p:'Tu gingivitis está en su mejor zona. ¡Sigue así!',met:1}}
function apptConflict(S,ts,ig,cid){for(const a of S.appts){if(a.id==ig)continue;if(a.ts==ts)return'time';if(a.cid==cid&&new Date(a.ts).toDateString()==new Date(ts).toDateString())return'day'}return null}
function headDays(S,now=Date.now()){return Math.floor((now-S.head.since)/D)}
//#LOGIC-END

ipadas (modelo de coinversión con doctores socios locales) y centros odontológicos independientes adheridos como «Clínicas Aliadas», cada uno de los cuales mantiene su propia personalidad jurídica y responsabilidad sanitaria respecto a los actos médicos realizados en sus instalaciones.</li>\n</ul>\n<h3>1.2. Objeto y Descripción del Ecosistema Tecnológico Vitality Pro</h3>\n<p>Las presentes Condiciones Generales de Uso y Política de Privacidad (en adelante, las «Condiciones») regulan el acceso, descarga, vinculación de hardware y utilización de la aplicación móvil <b>Vitality Pro</b> (disponible para sistemas operativos iOS y Android), así como los servicios digitales asociados al uso del cepillo dental eléctrico conectado con biosensor de biomarcadores salivales fabricado en alianza industrial de co-branding con <b>VITIS (Dentaid)</b>. El ecosistema Vitality Pro integra tres capas operativas:</p>\n<ul>\n<li><b>Dispositivo Conectado y Consumible Biosensor: </b>Mango eléctrico con conectividad Bluetooth Low Energy (BLE) y cabezales intercambiables equipados con tiras biosensoras de polímeros de impronta molecular (MIP) capaces de analizar parámetros químicos y biológicos en saliva durante el cepillado habitual.</li>\n</ul>\n<ul>\n<li><b>Plataforma Cloud e Inteligencia Preventiva (Software como Servicio): </b>Infraestructura alojada en la Unión Europea que procesa las lecturas salivales bajo estándares internacionales de interoperabilidad sanitaria (HL7 FHIR), calcula el índice evolutivo de salud bucodental (<i>Oral Health Score</i>) y genera alertas preventivas personalizadas.</li>\n</ul>\n<ul>\n<li><b>Servicios Opcionales de Conexión Clínica (B2B2C) e Inteligencia Biométrica (Data API B2B): </b>Módulos activables exclusivamente bajo consentimiento expreso, granular e independiente del Usuario durante el proceso de alta («Tus datos, tu decisión») o en cualquier momento posterior desde el menú Ajustes &gt; Privacidad.</li>\n</ul>\n<h3>1.3. Naturaleza Preventiva del Servicio y Exención de Diagnóstico Médico (IVDR y AI Act)</h3>\n<p>La calificación regulatoria de Vitality Pro dependerá de su finalidad prevista, indicaciones declaradas (<i>claims</i>), funcionamiento y versión comercial. Antes de la puesta en el mercado, Cleardent documentará la clasificación del biosensor y del software conforme al Reglamento (UE) 2017/746 sobre productos sanitarios para diagnóstico in vitro (IVDR) y, cuando proceda, del software como producto sanitario, incluida su evaluación de conformidad y marcado CE. El Reglamento (UE) 2024/1689 de Inteligencia Artificial (AI Act) se aplicará según la función y clasificación final del sistema. Estas Condiciones regulan la relación contractual con el Usuario y no sustituyen el expediente técnico, la evaluación clínica o de rendimiento, el sistema de gestión de calidad ni las obligaciones legales de vigilancia poscomercialización.</p>\n<ul>\n<li><b>Finalidad Exclusivamente Preventiva e Informativa: </b>Las métricas, gráficos de tendencia, puntuaciones (<i>Oral Health Score</i>) y alertas tempranas mostradas en la Aplicación tienen carácter orientativo, educativo y preventivo. Su objetivo es fomentar hábitos saludables de higiene oral y facilitar la detección precoz de variaciones en biomarcadores salivales.</li>\n</ul>\n<ul>\n<li><b>Ausencia de Diagnóstico Médico Automatizado: </b>Ninguna lectura del biosensor ni ningún resultado generado por los algoritmos de Inteligencia Artificial de Vitality Pro constituye un diagnóstico clínico definitivo, prescripción terapéutica ni sustituto del criterio profesional de un odontólogo o médico colegiado.</li>\n</ul>\n<ul>\n<li><b>Supervisión Humana Obligatoria: </b>Cualquier alerta preventiva emitida por el sistema requiere, para su confirmación clínica y eventual tratamiento, la valoración presencial y supervisión humana de un profesional sanitario habilitado. Ante dolor agudo, sangrado persistente, inflamación severa o cualquier urgencia médica, el Usuario debe acudir directamente a un centro sanitario sin esperar indicaciones de la Aplicación.</li>\n</ul>\n<h2>2. Condiciones Generales de Uso de la Aplicación y del Dispositivo</h2>\n<h3>2.1. Requisitos de Registro, Capacidad Legal y Seguridad de la Cuenta</h3>\n<p>El servicio se dirige, con carácter general, a personas mayores de dieciocho (18) años con plena capacidad de obrar. La eventual habilitación para menores exigirá una modalidad específica, información adaptada, verificación de la representación legal y criterios sanitarios y de protección de datos definidos previamente. Hasta que esa modalidad esté disponible, no deberá registrarse a menores ni tratar sus biomarcadores mediante la Aplicación.</p>\n<p>El Usuario se compromete a facilitar información veraz en su perfil inicial de salud, custodiar diligentemente sus credenciales de acceso (autenticación reforzada) y no compartir su cepillo ni cabezal biosensor con terceras personas, dado que la mezcla de muestras salivales invalidaría la trazabilidad clínica y la precisión de las alertas.</p>\n<h3>2.2. Mantenimiento del Dispositivo, Sustitución del Cabezal, Bloqueo Preventivo y Compromiso Zero Waste</h3>\n<p>Para garantizar la fiabilidad analítica del biosensor salival, el Usuario deberá sustituir el cabezal desechable cada noventa (90) días o cuando la Aplicación emita el aviso técnico de fin de vida útil de la tira reactiva. La Aplicación muestra el estado del cabezal y avisa cuando toca cambiarlo, pero no permite comprar recambios ni gestiona pedidos, pagos o suscripciones: el Usuario adquirirá los cabezales homologados a través de los canales de venta habituales, fuera de la Aplicación.</p>\n<div class=\"call\"><p><b>Protocolo Técnico de Caducidad del Cabezal Biosensor (Garantía de Precisión Analítica e IVDR)</b> Transcurrido el plazo máximo de noventa (90) días desde la activación del cabezal o alcanzado el límite técnico de lecturas validado para la tira biosensora, la degradación natural del polímero de impronta molecular (MIP) impide garantizar la exactitud de las mediciones. En consecuencia, <b>la Aplicación desactivará automáticamente el motor de alertas preventivas y el cálculo actualizado del Oral Health Score</b> (etiquetando cualquier lectura posterior como <i>«cabezal caducado – precisión analítica no garantizada»</i>) hasta que el Usuario vincule un nuevo cabezal homologado con lote vigente. Esta medida técnica protege la seguridad sanitaria del Usuario y asegura la integridad clínica del sistema conforme a las obligaciones de vigilancia poscomercialización.</p></div>\n<p>En coherencia con la política de sostenibilidad ambiental (ISO 14001) y economía circular <i>Zero Waste</i> de Cleardent, el Usuario podrá depositar los cabezales usados en los puntos de recogida habilitados en clínicas Cleardent y farmacias adheridas para la recuperación de componentes electrónicos y materiales reciclables.</p>\n<h3>2.3. Derechos del Usuario sobre Datos de Productos Conectados (EU Data Act)</h3>\n<p>De conformidad con el Reglamento (UE) 2023/2854 (Ley de Datos o <i>Data Act</i>), el Usuario conserva en todo momento el derecho de acceso gratuito, directo y estructurado a los datos brutos y procesados generados por el uso de su cepillo conectado Vitality Pro, pudiendo consultarlos en tiempo real en la Aplicación y exportarlos en formato interoperable estándar (FHIR / JSON / PDF) para su uso personal o entrega a cualquier profesional sanitario de su elección.</p>\n<h3>2.4. Propiedad Intelectual e Industrial</h3>\n<p>Todos los derechos de propiedad intelectual e industrial sobre la Aplicación Vitality Pro, su código fuente, firmware, modelos de aprendizaje automático, arquitectura de datos, diseños industriales, patentes del sistema biosensor salival y signos distintivos corresponden en exclusiva a Clínicas Cleardent, S.L. (o a sus respectivos licenciantes tecnológicos y al socio industrial VITIS/Dentaid respecto a las marcas y componentes de cepillado propios). Se concede al Usuario una licencia de uso personal, no exclusiva, revocable e intransferible limitada al disfrute del servicio conforme a estas Condiciones.</p>\n<h3>2.5. Garantía de No Discriminación por Configuración de Privacidad</h3>\n<p>La negativa del Usuario a activar los permisos opcionales («Compartir mi informe con mis clínicas» y/o «Compartir datos para Data API B2B»), así como su posterior revocación, <b>no afectará en modo alguno</b> a la calidad, disponibilidad, funcionalidades básicas de medición, cálculo del <i>Oral Health Score</i> ni al precio del hardware o de la Aplicación Vitality Pro.</p>\n<h2>3. Política de Privacidad y Protección de Datos Personales</h2>\n<h3>3.1. Categorías de Datos Personales y Datos de Salud Tratados</h3>\n<p>Para el funcionamiento de Vitality Pro, Cleardent trata las siguientes categorías de datos personales:</p>\n<ul>\n<li><b>Datos Identificativos y de Contacto: </b>Nombre, apellidos, correo electrónico, teléfono, fecha de nacimiento, sexo biológico (relevante para rangos de referencia fisiológicos), código postal y credenciales cifradas. Cuando el Usuario lo solicita expresamente para buscar clínicas cercanas, la Aplicación utiliza su ubicación aproximada o el código postal que introduzca únicamente para ordenar las clínicas por distancia; la ubicación no se guarda en su perfil ni se comparte con terceros.</li>\n</ul>\n<ul>\n<li><b>Datos Técnicos y de Telemetría del Dispositivo (IoT): </b>Identificador único del módulo BLE, número de lote del cabezal biosensor (trazabilidad regulatoria IVDR), fecha de activación y caducidad del cabezal, frecuencia, duración y horarios de cepillado, nivel de batería e historial de alertas técnicas.</li>\n</ul>\n<ul>\n<li><b>Categorías Especiales de Datos Relativos a la Salud (Art. 9 RGPD):</b></li>\n</ul>\n<ul>\n<li><b><i>Cuestionario Inicial de Salud: </i></b>Antecedentes odontológicos declarados, hábitos de higiene, tabaquismo, sensibilidad dental o patologías previas relevantes.</li>\n</ul>\n<ul>\n<li><b><i>Biomarcadores Salivales Bucodentales (Etapa Inicial): </i></b>Concentraciones e índices de actividad enzimática (ej. metaloproteinasa-8 activa / aMMP-8), marcadores de inflamación gingival, riesgo de caries, placa bacteriana y riesgo periodontal.</li>\n</ul>\n<ul>\n<li><b><i>Biomarcadores Sistémicos y Moleculares (Evolución Tecnológica Futura): </i></b>En la medida en que el Usuario adquiera y vincule futuras generaciones de cabezales biosensorizados homologados y habilite explícitamente su lectura en la App, el sistema podrá procesar indicadores salivales vinculados a metabolismo (glucosa), estrés y sueño (cortisol), inflamación sistémica (proteína C reactiva) u otros biomarcadores moleculares validados clínicamente.</li>\n</ul>\n<h3>3.2. Arquitectura de Consentimiento Granular («Tus datos, tu decisión»)</h3>\n<p>Durante el proceso de configuración de la cuenta (Paso 2 de 6: <i>«Tus datos, tu decisión»</i>), el Usuario dispone de interruptores independientes —dos obligatorios (la aceptación de las Condiciones y el consentimiento explícito para el tratamiento de sus datos de salud, que se recaba en un interruptor separado) y dos opcionales— que definen exactamente el alcance del tratamiento de sus datos y las comunicaciones opcionales a terceros:</p>\n<div class=\"tw\"><table><thead><tr><th><b>Opción en la App</b></th><th><b>Carácter</b></th><th><b>Finalidad y Alcance del Tratamiento</b></th><th><b>Base Jurídica y Control del Usuario</b></th></tr></thead><tbody><tr><td><b>1. Acepto las condiciones de uso y la política de privacidad</b></td><td><b>Obligatorio</b> <b>(Servicio Core)</b></td><td>Alta de usuario, sincronización BLE cepillo-app, almacenamiento cifrado del historial personal de biomarcadores, cálculo del Oral Health Score, envío de alertas preventivas en la App y trazabilidad sanitaria de lotes (IVDR).</td><td>La aceptación de las Condiciones formaliza el contrato, pero no equivale por sí sola al consentimiento para tratar datos de salud. El servicio esencial se apoya en la ejecución contractual para datos ordinarios (art. 6.1.b RGPD) y requiere una declaración separada de consentimiento explícito para las lecturas y el perfil de salud (art. 9.2.a RGPD), salvo obligación legal aplicable. La vigilancia regulatoria se limitará a los datos exigidos por la normativa de producto sanitario.</td></tr><tr><td><b>2. Compartir mi informe con mis clínicas</b></td><td><b>Opcional</b> <b>(Opt-in expreso)</b></td><td>Transmisión del informe de salud bucodental y alertas preventivas a la clínica Cleardent o a una tercera Clínica Aliada seleccionada por el Usuario para facilitar la reserva de cita, triaje preventivo y continuidad asistencial.</td><td>Consentimiento explícito del interesado (Art. 6.1.a y Art. 9.2.a RGPD) para la comunicación de datos y prestación de asistencia sanitaria por el centro elegido (Art. 9.2.h RGPD y Ley 41/2002). Revocable en 1 clic en Ajustes &gt; Privacidad.</td></tr><tr><td><b>3. Compartir datos para Data API B2B</b></td><td><b>Opcional</b> <b>(Opt-in expreso)</b></td><td>Extracción hacia un entorno aislado donde los datos se anonimizan y agregan en cohortes estadísticas (≥20 usuarios) para su consulta vía API por terceras empresas (MedTech, Pharma, investigación y aseguradoras).</td><td>Consentimiento explícito, específico y separado para preparar los datos personales de salud con fines de analítica agregada B2B (arts. 6.1.a y 9.2.a RGPD). Superada una verificación documentada de anonimización efectiva, los resultados estadísticos anónimos quedan fuera del RGPD. Cada proyecto B2B superará una evaluación jurídica previa y, cuando proceda, el régimen del Reglamento (UE) 2025/327 (EEDS).</td></tr></tbody></table></div>\n<h3>3.3. Regulación Detallada del Permiso Opcional 1: «Compartir mi informe con mis clínicas» (Comunicación a Centros Sanitarios)</h3>\n<p>Si el Usuario activa voluntariamente la opción <i>«Compartir mi informe con mis clínicas»</i>, autoriza a Cleardent a compartir sus resultados e informes preventivos con el centro odontológico que el Usuario seleccione en cada momento, bajo las siguientes reglas estrictas de privacidad y delimitación de responsabilidad:</p>\n<ul>\n<li><b>Diferenciación de Acceso y Rol Jurídico según Tipo de Centro:</b></li>\n</ul>\n<ul>\n<li><b><i>Clínicas de la Red Cleardent: </i></b>Si el Usuario es paciente o selecciona un centro de la red Clínicas Cleardent, su informe evolutivo se integrará de forma segura en el sistema de gestión clínica (GESDEN) y en su Historia Clínica Electrónica (HCE), permitiendo al equipo odontológico visualizar el historial de biomarcadores y registrar recomendaciones médicas en la App conforme a la Ley 41/2002 de Autonomía del Paciente.</li>\n</ul>\n<ul>\n<li><b><i>Clínicas Aliadas (Terceras Empresas Sanitarias Adheridas): </i></b>Si el Usuario elige ser atendido en una «Clínica Aliada» externa perteneciente a la red de centros colaboradores de Vitality Pro, dicha tercera clínica <b>no tendrá acceso irrestricto</b> a la aplicación ni al historial completo del Usuario; únicamente recibirá a través del Portal de Dentistas la alerta preventiva puntual y el informe resumen necesario para gestionar la cita solicitada. Desde el momento en que la Clínica Aliada externa recibe dicho informe y asume la atención del paciente, <b>adquiere la condición de Responsable del Tratamiento y prestador sanitario independiente</b> respecto de la asistencia odontológica presencial, el diagnóstico médico y la custodia de su historia clínica conforme a la Ley 41/2002, quedando Clínicas Cleardent, S.L. (NIF B72202070) exenta de cualquier responsabilidad derivada de la praxis clínica o gestión asistencial de dichos centros de terceros.</li>\n</ul>\n<ul>\n<li><b>Transparencia Informativa sobre la Relación Comercial con Clínicas Aliadas: </b>En cumplimiento del deber de transparencia y lealtad informativa del RGPD, se informa al Usuario de que las terceras Clínicas Aliadas abonan a Clínicas Cleardent, S.L. una contraprestación tecnológica por el uso del portal clínico y por la gestión de las derivaciones asistenciales generadas a través de la plataforma. Esta relación comercial B2B2C no supone ningún coste adicional para el Usuario, ni condiciona en modo alguno la independencia clínica del profesional sanitario ni la libertad del Usuario para acudir a cualquier otro centro de su elección.</li>\n</ul>\n<h3>3.4. Regulación Detallada del Permiso Opcional 2: «Compartir datos para Data API B2B» (Analítica Agregada para Terceras Empresas)</h3>\n<p>Si el Usuario activa voluntariamente la opción <i>«Compartir datos para Data API B2B»</i>, autoriza a Cleardent a someter sus métricas de salud bucodental y biomarcadores salivales a un proceso de anonimización irreversible y agregación estadística para su puesta a disposición de terceras empresas del sector salud (compañías farmacéuticas, fabricantes de dispositivos médicos MedTech, centros de investigación biomédica y entidades aseguradoras) a través del servicio <b>Cleardent Data API</b>, sujeto a las siguientes salvaguardas técnicas y jurídicas inquebrantables:</p>\n<ul>\n<li><b>Separación Física y Lógica de Entornos: </b>Los datos clínicos identificativos (alojados en AWS HealthLake) están completamente segregados del entorno analítico (Amazon Redshift). Antes de ingresar en el lago de datos analítico, un proceso automatizado de ETL (AWS Glue) elimina todo atributo identificativo directo o indirecto (nombre, DNI, correo, teléfono, dirección IP, identificadores de dispositivo o clínica exacta).</li>\n</ul>\n<ul>\n<li><b>Anonimización Verificable y Control del Riesgo de Reidentificación: </b>Las terceras empresas clientes de la Data API B2B no recibirán datos personales, registros individuales ni identificadores persistentes. Las consultas se limitarán exclusivamente a resultados estadísticos agregados sujetos a estrictos controles de salida. Dado que un umbral orientativo de veinte (20) personas no garantiza por sí solo la anonimización en todos los escenarios, Cleardent evaluará los riesgos de singularización, vinculabilidad e inferencia, aplicará técnicas adicionales de generalización y ruido estadístico cuando proceda, y documentará pruebas periódicas de riesgo de reidentificación antes de habilitar cada categoría de acceso. Si el riesgo no es suficientemente remoto, los datos seguirán considerándose personales y no se facilitarán a través de la API.</li>\n</ul>\n<ul>\n<li><b>Transparencia sobre la Monetización B2B y Alcance Específico para Entidades Aseguradoras: </b>Se informa al Usuario con total claridad de que Cleardent comercializa suscripciones de acceso a esta inteligencia poblacional agregada a terceras empresas para impulsar la investigación epidemiológica, el desarrollo de nuevos biomarcadores salivales y programas de salud preventiva. En el caso particular de <b>entidades aseguradoras de salud</b>, el acceso a través de Data API B2B se circunscribe estrictamente a <b>indicadores macro-epidemiológicos agregados</b> orientados al diseño de programas colectivos de prevención bucodental y evaluación de impacto preventivo, sin acceso alguno a datos individuales ni identificables.</li>\n</ul>\n<ul>\n<li><b>Usos Prohibidos Exigidos Contractualmente a Terceras Empresas B2B: </b>Cleardent impone mediante contrato vinculante a todas las terceras empresas usuarias de Data API B2B la prohibición absoluta de utilizar los resultados agregados para: (i) identificar, singularizar o perfilar a personas físicas; (ii) fijar primas individuales, coberturas, franquicias, exclusiones, elegibilidad o condiciones de contratación de seguros; (iii) adoptar decisiones en materia de empleo o crédito; (iv) realizar publicidad dirigida individualmente; (v) adoptar decisiones clínicas automatizadas; (vi) cruzar o combinar los resultados con otras bases de datos para intentar reidentificar usuarios; o (vii) entrenar modelos algorítmicos destinados a cualquiera de los fines anteriores. Dichos contratos incorporan facultades de auditoría, suspensión inmediata del acceso API, supresión y régimen sancionador por incumplimiento.</li>\n</ul>\n<ul>\n<li><b>Efectos de la Revocación por el Usuario: </b>Si el Usuario desactiva este interruptor en Ajustes &gt; Privacidad, sus nuevas lecturas dejarán de incorporarse al flujo de anonimización de forma inmediata, sin perjuicio de la validez de los agregados estadísticos irreversibles generados con anterioridad conforme al RGPD.</li>\n</ul>\n<h3>3.5. Gobernanza, Decisiones Automatizadas y Evaluación de Impacto (EIPD)</h3>\n<p>Cleardent realizará y mantendrá actualizada una Evaluación de Impacto relativa a la Protección de Datos (EIPD) antes del inicio del piloto clínico y ante cualquier cambio sustancial en el tratamiento, incluyendo la incorporación de nuevos biomarcadores, nuevas finalidades, actualización de modelos de Inteligencia Artificial, nuevos flujos de acceso clínico o apertura de categorías en Data API B2B.</p>\n<p>Asimismo, se documentarán formalmente los roles de responsable, corresponsable o encargado del tratamiento de Clínicas Cleardent, S.L., cada sociedad clínica participada, las Clínicas Aliadas externas, el socio industrial VITIS/Dentaid, AWS y demás proveedores tecnológicos mediante acuerdos específicos y matrices de responsabilidad. Vitality Pro no adoptará decisiones con efectos jurídicos o significativamente similares basadas únicamente en el tratamiento automatizado: las alertas, puntuaciones y recomendaciones serán explicables, impugnables y sometidas a revisión humana profesional cuando puedan incidir en la atención sanitaria.</p>\n<h3>3.6. Resumen de Seguridad Cloud, Plazos de Conservación y Transferencias Internacionales</h3>\n<div class=\"tw\"><table><thead><tr><th><b>Dimensión de Gobernanza</b></th><th><b>Garantías Aplicadas por Clínicas Cleardent, S.L.</b></th></tr></thead><tbody><tr><td><b>Alojamiento y Cifrado</b> <b>(Infraestructura UE)</b></td><td>La infraestructura cloud opera en centros de datos de Amazon Web Services (AWS) ubicados en la Unión Europea. Los datos de salud se almacenan bajo el estándar internacional HL7 FHIR (AWS HealthLake) cifrados en tránsito (TLS 1.3) y en reposo mediante claves gestionadas dedicadas (AWS KMS), con registro inmutable de auditoría de accesos (AWS CloudTrail) y pruebas periódicas de seguridad.</td></tr><tr><td><b>Relación con el Socio Industrial (VITIS / Dentaid)</b></td><td>VITIS (Dentaid) participa exclusivamente en la fabricación y comercialización del hardware (cepillo y cabezales). La Aplicación Vitality Pro no gestiona pedidos, pagos ni envíos de recambios, por lo que no se comparte con VITIS ningún dato de la cuenta para estos fines. VITIS no tiene acceso en ningún caso a los datos de salud, lecturas salivales ni informes clínicos generados en la Aplicación Vitality Pro.</td></tr><tr><td><b>Plazos de Conservación</b></td><td>(a) Cuenta de usuario y lecturas en la App: mientras el Usuario mantenga activa su cuenta y no solicite su supresión. (b) Datos integrados en Historia Clínica (Clínicas Cleardent o Clínicas Aliadas): mínimo cinco (5) años desde la fecha de alta de cada proceso asistencial conforme al art. 17 de la Ley 41/2002 (o plazo autonómico superior aplicable). (c) Trazabilidad de lotes sanitarios (IVDR): conforme a los plazos legales de vigilancia poscomercialización de productos sanitarios.</td></tr><tr><td><b>Transferencias Internacionales</b></td><td>Se prioriza el tratamiento íntegro en el Espacio Económico Europeo (EEE). Cleardent verificará de forma continua la ubicación efectiva de servidores, accesos remotos de soporte, telemetría y cadena completa de subencargados. Cuando exista una transferencia internacional fuera del EEE, se identificará el país y destinatario, se aplicará el mecanismo válido conforme al Capítulo V del RGPD (decisiones de adecuación o Cláusulas Contractuales Tipo), se realizará una evaluación de impacto de transferencia y se adoptarán medidas técnicas complementarias.</td></tr></tbody></table></div>\n<h3>3.7. Medidas de Seguridad, Gestión de Brechas y Proveedores</h3>\n<p>Cleardent aplicará medidas técnicas y organizativas proporcionales al riesgo inherente al tratamiento de datos de salud: control de acceso basado en roles y principio de mínimo privilegio, autenticación multifactor (MFA) obligatoria para perfiles profesionales y administrativos, cifrado extremo a extremo, segregación estricta entre entornos clínicos y analíticos, registro y revisión periódica de auditoría de accesos, copias de seguridad cifradas, pruebas periódicas de vulnerabilidad, gestión de parches y protocolos de respuesta ante incidentes.</p>\n<p>Cualquier brecha de seguridad que afecte a datos personales será evaluada de inmediato y, cuando proceda conforme a los artículos 33 y 34 del RGPD, notificada a la autoridad de control competente en un plazo máximo de setenta y dos (72) horas, así como comunicada sin dilación indebida a los Usuarios afectados cuando entrañe un alto riesgo para sus derechos y libertades. La contratación de proveedores y subencargados exigirá garantías documentadas de cumplimiento, sujeción a instrucciones, deber de confidencialidad, asistencia en el ejercicio de derechos e incidentes y devolución o supresión segura de los datos al finalizar la prestación.</p>\n<h3>3.8. Ejercicio de Derechos y Revocación Granular de Permisos</h3>\n<p>El Usuario puede gestionar, modificar o retirar sus consentimientos opcionales (<i>«Compartir mi informe con mis clínicas»</i> y <i>«Compartir datos para Data API B2B»</i>) de forma instantánea y gratuita en cualquier momento desde el menú <b>Ajustes &gt; Privacidad</b> de la Aplicación Vitality Pro.</p>\n<p>Asimismo, el Usuario podrá ejercer sus derechos de <b>acceso, rectificación, supresión («derecho al olvido»), oposición, limitación del tratamiento y portabilidad de datos</b> dirigiendo una solicitud acompañada de acreditación de identidad al Delegado de Protección de Datos de Clínicas Cleardent, S.L. en <b>dpo@cleardent.es</b> o por correo postal a Avda. de la Innovación, 2, Edificio Eureka, Planta 2, Geolit, 23620 Mengíbar (Jaén). Si considera que sus derechos no han sido debidamente atendidos, tiene derecho a presentar una reclamación ante la <b>Agencia Española de Protección de Datos (AEPD)</b> en www.aepd.es.</p>\n<h2>4. Modificaciones, Legislación Aplicable y Jurisdicción</h2>\n<p>Clínicas Cleardent, S.L. podrá actualizar las presentes Condiciones para adaptarlas a novedades legislativas, criterios de autoridades sanitarias o de protección de datos, o a la incorporación de nuevos biomarcadores homologados en el ecosistema Vitality Pro. Cualquier modificación sustancial será notificada al Usuario con al menos quince (15) días de antelación a través de la Aplicación y por correo electrónico; cuando la actualización implique nuevas finalidades de tratamiento, se recabará nuevamente el consentimiento expreso del Usuario.</p>\n<p>Las presentes Condiciones se rigen íntegramente por la legislación española y la normativa de la Unión Europea aplicable. Para la resolución de cualquier controversia derivada de la interpretación o ejecución de este documento, las partes se someten a los Juzgados y Tribunales del domicilio del Usuario cuando este ostente la condición de consumidor y usuario conforme al Real Decreto Legislativo 1/2007.</p>";

function factors(k){const q=S.q,c=q.cond||[],m=q.meds||[],a=q.apar||[],r=[],h=(arr,s)=>arr.some(x=>x.startsWith(s)),g=k=='gingi',pe=k=='perio',ca=k=='caries',pl=k=='plaque';

function mchart(){const rs=hist(S).filter(r=>r.t>=Date.now()-30*D).reverse();if(rs.length<2)return'<p class="m">Con tu próximo análisis empezarás a ver tu evolución.</p>';const W=340,Hh=140,S3=[['plaque','#0A2F5C',''],['gingi','#00A3A0','7 4'],['caries','#334155','2 3'],['perio','#0A2F5C','10 3 2 3'],['habit','#00A3A0','']],all=rs.flatMap(r=>S3.map(s=>r.v[s[0]])).filter(v=>v!=null),mn=Math.min(...all)-4,mx=Math.max(...all)+4,x=i=>12+i*(W-24)/(rs.length-1),y=a=>Hh-22-(a-mn)/(mx-mn)*(Hh-34),dd=r=>new Date(r.t).toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit'});
